<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1512">
  <title>MindBridge AI · 内测体验入口</title>
  <style>
    :root {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, sans-serif;
      color: #f2ebe0;
      background: #0a1512;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 24px;
      background:
        radial-gradient(720px 480px at 50% -8%, rgba(238,185,108,.13), transparent 62%),
        radial-gradient(620px 460px at 8% 110%, rgba(71,143,113,.12), transparent 66%),
        linear-gradient(168deg, #0f1c19, #0a1512);
    }
    main { width: min(920px, 100%); text-align: center; }
    .logo {
      width: 66px;
      height: 66px;
      margin: 0 auto 24px;
      position: relative;
      display: grid;
      place-items: center;
    }
    .logo::before {
      content: "";
      position: absolute;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(238,185,108,.26), rgba(238,185,108,.08) 44%, transparent 70%);
      animation: breathe 4.2s ease-in-out infinite;
    }
    .logo svg {
      position: relative;
      width: 66px;
      height: 66px;
      filter: drop-shadow(0 0 22px rgba(238,185,108,.42));
      animation: lampGlow 4.2s ease-in-out infinite;
    }
    h1 {
      margin: 0;
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
      font-size: clamp(28px, 4vw, 38px);
      letter-spacing: .04em;
      font-weight: 600;
    }
    .tagline {
      margin: 10px 0 0;
      color: #82998f;
      font-size: 11px;
      letter-spacing: .28em;
    }
    .prompt { margin: 42px 0 8px; color: #bdd0c7; font-size: 15px; }
    .hint { margin: 0 0 26px; color: #6f857c; font-size: 12px; }
    .roles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .role {
      min-height: 190px;
      padding: 28px 22px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: inherit;
      text-decoration: none;
      border: 1px solid rgba(127,201,143,.15);
      border-radius: 16px;
      background: rgba(22,44,38,.58);
      box-shadow: 0 18px 50px rgba(0,0,0,.12);
      transition: transform .25s ease, border-color .25s ease, background .25s ease, box-shadow .25s ease;
    }
    .role:hover, .role:focus-visible {
      transform: translateY(-5px);
      border-color: rgba(238,185,108,.5);
      background: rgba(238,185,108,.09);
      box-shadow: 0 20px 46px rgba(0,0,0,.34);
      outline: none;
    }
    .icon { font-size: 30px; line-height: 1; margin-bottom: 17px; }
    .name { font-size: 16px; font-weight: 650; }
    .desc { margin-top: 8px; color: #91a99e; font-size: 12px; line-height: 1.55; }
    .enter {
      width: 100%;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid rgba(127,201,143,.12);
      color: #c79c62;
      font-size: 11px;
      letter-spacing: .08em;
    }
    @keyframes breathe { 50% { opacity: .72; transform: scale(1.07); } }
    @keyframes lampGlow {
      50% { filter: drop-shadow(0 0 12px rgba(238,185,108,.85)) drop-shadow(0 0 34px rgba(238,185,108,.45)); }
    }
    @media (max-width: 680px) {
      body { place-items: start center; padding: 42px 18px; }
      .roles { grid-template-columns: 1fr; }
      .role { min-height: 142px; padding: 22px; }
      .prompt { margin-top: 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo::before, .logo svg { animation: none; }
      .role { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">
      <svg viewBox="0 0 40 40" fill="none" role="img" aria-label="MindBridge">
        <path d="M20 4c-6 0-11 5-11 11 0 4 2 7 5 9v8a6 6 0 0012 0v-8c3-2 5-5 5-9 0-6-5-11-11-11z"
          stroke="#eeb96c" stroke-width="1.5" opacity=".8"/>
        <ellipse cx="20" cy="19" rx="4.5" ry="6" fill="#0a1512" stroke="#eeb96c" stroke-width="1.3"/>
        <circle cx="20" cy="19" r="1.7" fill="#eeb96c"/>
      </svg>
    </div>
    <h1>MindBridge AI</h1>
    <p class="tagline">企业员工心理安全与成长共生系统</p>
    <p class="prompt">请选择体验入口</p>
    <p class="hint">评审体验组专用 · 凭邀请进入，数据相互隔离</p>

    <nav class="roles" aria-label="内测体验入口">
      <a class="role" href="https://mindbridge-beta.pages.dev/?invite=krJd1y0U20FPovyP">
        <span class="icon" aria-hidden="true">👤</span>
        <span class="name">员工端</span>
        <span class="desc">匿名倾诉 · 心理资源 · 活动体验</span>
        <span class="enter">进入员工体验 →</span>
      </a>
      <a class="role" href="https://mindbridge-console.pages.dev/?orgKey=F9Q79Sd6SbByu2x2eQo2E_A9Cbz-b_n2qxeKze8850Q">
        <span class="icon" aria-hidden="true">📊</span>
        <span class="name">管理端</span>
        <span class="desc">组织趋势 · 聚合看板 · 干预配置</span>
        <span class="enter">进入组织看板 →</span>
      </a>
      <a class="role" href="https://mindbridge-console.pages.dev/healer/?k=PWMot3sp4nzhKHcZlpzUPLeoT95f0CuJW7wYf5Clhho">
        <span class="icon" aria-hidden="true">🌿</span>
        <span class="name">疗愈师端</span>
        <span class="desc">匿名个案 · 授权上下文 · 跟进记录</span>
        <span class="enter">进入个案工作台 →</span>
      </a>
    </nav>
  </main>
</body>
</html>
