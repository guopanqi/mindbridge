<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" width="1240" height="660" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<defs>
  <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0 0.5 L8 4.5 L0 8.5 z" fill="#8a968f"/>
  </marker>
  <marker id="a2r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0 0.5 L8 4.5 L0 8.5 z" fill="#b0453a"/>
  </marker>
  <style>
    .h  {font-size:25px; font-weight:700; fill:#23302b}
    .sub{font-size:13px; fill:#6e7d76}
    .col{font-size:14px; font-weight:700; fill:#1d6b52; letter-spacing:.08em}
    .colA{font-size:14px; font-weight:700; fill:#a8761d; letter-spacing:.08em}
    .bt {font-size:14px; font-weight:600; fill:#23302b}
    .bd {font-size:11.5px; fill:#67756e}
    .lb {font-size:11px; fill:#8a968f}
    .mono{font-family:"SF Mono",Menlo,monospace; font-size:11px; fill:#1d6b52}
    .red{font-size:12px; fill:#b0453a; font-weight:600}
    .tag{font-size:10.5px; font-weight:700; fill:#fff}
  </style>
</defs>

<rect width="1240" height="660" fill="#fbfcfb"/>

<text class="h" x="46" y="52">AI 对话能力：当前实现与接入路径</text>
<text class="sub" x="46" y="78">Demo 的对话由内置规则引擎驱动，可随时接入大模型 API —— 判定逻辑与合规约束已经就位，无需重写</text>

<!-- ================= 上：现在 ================= -->
<text class="col" x="46" y="126">现在 · Demo 内置规则引擎（零依赖，单个 HTML 文件即可运行）</text>

<rect x="46" y="142" width="1148" height="140" rx="12" fill="#f3f8f5" stroke="#cfe2d8"/>

<rect x="68" y="170" width="118" height="88" rx="8" fill="#fff" stroke="#cfe2d8"/>
<text class="bt" x="86" y="198">员工输入</text>
<text class="bd" x="86" y="220">自由文本</text>
<text class="bd" x="86" y="240">或转发内容</text>

<path d="M192 214 L216 214" stroke="#8a968f" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>

<rect x="222" y="170" width="178" height="88" rx="8" fill="#fff" stroke="#cfe2d8"/>
<text class="bt" x="240" y="198">分句 · 词典匹配</text>
<text class="bd" x="240" y="220">7 类情绪 · 300+ 关键词</text>
<text class="bd" x="240" y="240">按小句加权，越靠后越重</text>

<path d="M406 214 L430 214" stroke="#8a968f" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>

<rect x="436" y="170" width="178" height="88" rx="8" fill="#fff" stroke="#cfe2d8"/>
<text class="bt" x="454" y="198">语法与强度判别</text>
<text class="bd" x="454" y="220">否定语境排除误报</text>
<text class="bd" x="454" y="240">程度副词、感叹、叠字加权</text>

<path d="M620 214 L644 214" stroke="#8a968f" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>

<rect x="650" y="170" width="178" height="88" rx="8" fill="#fdf4f2" stroke="#eccdc6"/>
<text class="bt" x="668" y="198" fill="#a8453a">危机词判定</text>
<text class="bd" x="668" y="220">含隐晦表达词库</text>
<text class="red" x="668" y="240">否定语境保守降级</text>

<path d="M834 214 L858 214" stroke="#8a968f" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>

<rect x="864" y="170" width="178" height="88" rx="8" fill="#fff" stroke="#cfe2d8"/>
<text class="bt" x="882" y="198">会话状态累积</text>
<text class="bd" x="882" y="220">连续信号 → 升级黄色</text>
<text class="bd" x="882" y="240">跨 session 共享画像</text>

<path d="M1048 214 L1072 214" stroke="#8a968f" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>

<rect x="1078" y="170" width="94" height="88" rx="8" fill="#fff" stroke="#cfe2d8"/>
<text class="bt" x="1096" y="198">回应生成</text>
<text class="bd" x="1096" y="220">片段组合</text>
<text class="bd" x="1096" y="240">非查表</text>

<!-- ================= 下：接入后 ================= -->
<text class="colA" x="46" y="336">接入大模型后 · 生产形态　—　规则层不废弃，降级为前置／后置安全兜底层</text>

<rect x="46" y="352" width="1148" height="200" rx="12" fill="#fffaf0" stroke="#ecd9ae"/>

<rect x="68" y="388" width="118" height="88" rx="8" fill="#fff" stroke="#e2d6bc"/>
<text class="bt" x="86" y="416">员工输入</text>
<text class="bd" x="86" y="438">自由文本</text>
<text class="bd" x="86" y="458">或转发内容</text>

<path d="M192 432 L216 432" stroke="#8a968f" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>

<!-- 前置安全层 -->
<rect x="222" y="374" width="216" height="116" rx="8" fill="#f3f8f5" stroke="#a9d2bd" stroke-width="1.6"/>
<rect x="222" y="374" width="216" height="20" rx="8" fill="#1d6b52"/>
<rect x="222" y="384" width="216" height="10" fill="#1d6b52"/>
<text class="tag" x="234" y="389">前置安全层 · 同一套规则引擎</text>
<text class="bt" x="240" y="418">危机词判定优先</text>
<text class="bd" x="240" y="440">命中红色 → <tspan font-weight="700" fill="#a8453a">不调用模型</tspan></text>
<text class="bd" x="240" y="462">直接走固定话术 + 转接邀请</text>
<text class="bd" x="240" y="482">避免模型在高危场景自由发挥</text>

<path d="M444 432 L468 432" stroke="#8a968f" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>

<!-- 模型 -->
<rect x="474" y="374" width="278" height="116" rx="8" fill="#fff" stroke="#e2d6bc"/>
<text class="bt" x="494" y="404">大模型生成回应</text>
<text class="bd" x="494" y="428">系统提示词硬约束：</text>
<text class="bd" x="494" y="448">不做诊断 · 不建议用药 · 不替代专业</text>
<text class="bd" x="494" y="468">情绪标签与预警等级<tspan font-weight="700">仍由规则层输出</tspan></text>
<text class="lb" x="494" y="484">模型只负责"怎么说"，不负责"判定什么"</text>

<path d="M758 432 L782 432" stroke="#8a968f" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>

<!-- 后置校验 -->
<rect x="788" y="374" width="216" height="116" rx="8" fill="#f3f8f5" stroke="#a9d2bd" stroke-width="1.6"/>
<rect x="788" y="374" width="216" height="20" rx="8" fill="#1d6b52"/>
<rect x="788" y="384" width="216" height="10" fill="#1d6b52"/>
<text class="tag" x="800" y="389">后置校验 · 同一套规则引擎</text>
<text class="bt" x="806" y="418">输出再过一遍边界检查</text>
<text class="bd" x="806" y="440">拦截诊断性措辞、用药建议</text>
<text class="bd" x="806" y="462">拦截越界承诺</text>
<text class="bd" x="806" y="482">不合格则回落固定话术</text>

<path d="M1010 432 L1034 432" stroke="#8a968f" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>

<rect x="1040" y="388" width="132" height="88" rx="8" fill="#fff" stroke="#e2d6bc"/>
<text class="bt" x="1058" y="416">送达员工</text>
<text class="bd" x="1058" y="438">机器人会话</text>
<text class="bd" x="1058" y="458">或树洞页面</text>

<text class="lb" x="68" y="524">模型可选：Claude / DeepSeek / 通义等。判定逻辑与合规约束不依赖具体模型，可随时替换或私有化部署。</text>

<line x1="46" y1="580" x2="1194" y2="580" stroke="#dde5e1"/>
<text class="bt" x="46" y="612">「AI 只识别、不诊断」这条原则，靠提示词保证不了，必须靠架构保证。</text>
<text class="bd" x="46" y="638">把判定权留在确定性的规则层，把措辞交给模型——接入后前置与后置校验直接复用现有引擎，无需重写。</text>

</svg>
