<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" width="1240" height="690" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<defs>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 .5 L8 4.5 L0 8.5z" fill="#7d8a84"/></marker>
  <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 .5 L8 4.5 L0 8.5z" fill="#1d6b52"/></marker>
  <style>
    .h{font-size:25px;font-weight:700;fill:#23302b}.sub{font-size:13px;fill:#6e7d76}.col{font-size:14px;font-weight:700;fill:#1d6b52;letter-spacing:.08em}.bt{font-size:15px;font-weight:600;fill:#23302b}.bd{font-size:12px;fill:#67756e}.lb{font-size:11.5px;fill:#8a968f}.mono{font-family:"SF Mono",Menlo,monospace;font-size:11.5px;fill:#1d6b52}.no{font-size:12px;fill:#b0453a}
  </style>
</defs>
<rect width="1240" height="690" fill="#fbfcfb"/>
<text class="h" x="46" y="52">AI Agent 如何接入 MindBridge</text>
<text class="sub" x="46" y="78">Agent 是服务端的一项受控能力：读取匿名上下文，按策略调用工具，所有输出仍经过安全边界</text>

<text class="col" x="46" y="126">① 进入系统的请求</text>
<rect x="46" y="146" width="278" height="104" rx="10" fill="#fff" stroke="#dbe4df"/>
<rect x="46" y="146" width="4" height="104" rx="2" fill="#2d8f6a"/>
<text class="bt" x="68" y="176">员工主动请求</text>
<text class="bd" x="68" y="200">树洞对话 · 资源查找 · 疗愈预约</text>
<text class="bd" x="68" y="222">来自 H5 或企业机器人</text>
<rect x="46" y="270" width="278" height="104" rx="10" fill="#fff" stroke="#dbe4df"/>
<rect x="46" y="270" width="4" height="104" rx="2" fill="#2d8f6a"/>
<text class="bt" x="68" y="300">系统触发的关怀</text>
<text class="bd" x="68" y="324">仅使用聚合工作节奏与匿名画像</text>
<text class="bd" x="68" y="346">不读取企业聊天记录</text>

<path d="M330 198 L390 258" stroke="#7d8a84" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<path d="M330 322 L390 286" stroke="#7d8a84" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

<text class="col" x="390" y="126">② MindBridge 受控 Agent 层</text>
<rect x="390" y="146" width="454" height="422" rx="12" fill="#f3f8f5" stroke="#cfe2d8"/>
<rect x="416" y="170" width="402" height="72" rx="8" fill="#e9f4ee" stroke="#a9d2bd" stroke-width="1.5"/>
<text class="bt" x="438" y="198">匿名化与前置安全层</text>
<text class="mono" x="438" y="220">身份 → 匿名 ID　·　红色危机信号 → 固定转接流程</text>
<path d="M617 246 L617 270" stroke="#1d6b52" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>
<rect x="416" y="274" width="402" height="80" rx="8" fill="#fff" stroke="#cfe2d8"/>
<text class="bt" x="438" y="302">Agent 编排器</text>
<text class="bd" x="438" y="326">把当前诉求拆成步骤，只能调用允许的工具</text>
<text class="bd" x="438" y="344">不拥有身份识别、诊断或最终风险判定权限</text>
<path d="M617 358 L617 382" stroke="#1d6b52" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>
<rect x="416" y="386" width="188" height="72" rx="8" fill="#fff" stroke="#cfe2d8"/>
<text class="bt" x="436" y="414">对话模型</text>
<text class="bd" x="436" y="436">生成共情措辞与追问</text>
<rect x="630" y="386" width="188" height="72" rx="8" fill="#fff" stroke="#cfe2d8"/>
<text class="bt" x="650" y="414">知识与业务工具</text>
<text class="bd" x="650" y="436">资源检索 · 匹配 · 预约</text>
<path d="M617 462 L617 486" stroke="#1d6b52" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>
<rect x="416" y="490" width="402" height="54" rx="8" fill="#fffaf0" stroke="#ecd9ae"/>
<text class="bt" x="438" y="516">后置校验与审计</text>
<text class="bd" x="438" y="534">拦截越界输出；记录工具调用，不记录可还原身份</text>

<path d="M850 294 L908 294" stroke="#7d8a84" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<text class="col" x="908" y="126">③ 可交付的结果</text>
<rect x="914" y="174" width="280" height="88" rx="10" fill="#fff" stroke="#dbe4df"/>
<rect x="914" y="174" width="4" height="88" rx="2" fill="#c8873a"/>
<text class="bt" x="936" y="202">员工本人</text>
<text class="bd" x="936" y="226">对话回应 · 自助练习 · 匿名预约入口</text>
<text class="bd" x="936" y="246">可拒绝、清空或撤回</text>
<rect x="914" y="278" width="280" height="88" rx="10" fill="#fff" stroke="#dbe4df"/>
<rect x="914" y="278" width="4" height="88" rx="2" fill="#c8873a"/>
<text class="bt" x="936" y="306">持证疗愈师</text>
<text class="bd" x="936" y="330">仅在员工再次授权后接收转接请求</text>
<text class="bd" x="936" y="350">不由 Agent 自动披露个案内容</text>
<rect x="914" y="382" width="280" height="88" rx="10" fill="#fdf4f2" stroke="#eccdc6"/>
<text class="bt" x="936" y="410" fill="#a8453a">HRBP / 管理者</text>
<text class="no" x="936" y="434">仅看团队聚合趋势</text>
<text class="no" x="936" y="454">无姓名、无原文、无个案详情</text>

<rect x="46" y="596" width="1148" height="50" rx="10" fill="#fffaf0" stroke="#ecd9ae"/>
<text class="bt" x="70" y="626">核心边界</text>
<text class="bd" x="160" y="626">Agent 负责“怎么协助”和“调用什么工具”；风险分级、身份保护、危机转接和输出校验始终由确定性规则与人工授权控制。</text>
<text class="lb" x="46" y="674">Agent 可替换模型或工具实现，但不改变系统的数据最小化与人机边界。</text>
</svg>
