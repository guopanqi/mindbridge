<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 940" width="1240" height="940" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<defs>
  <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0 0.5 L8 4.5 L0 8.5 z" fill="#1d6b52"/>
  </marker>
  <marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0 0.5 L8 4.5 L0 8.5 z" fill="#c8873a"/>
  </marker>
  <style>
    .h  {font-size:26px; font-weight:700; fill:#23302b}
    .sub{font-size:13.5px; fill:#6e7d76}
    .colG{font-size:14px; font-weight:700; fill:#1d6b52; letter-spacing:.08em}
    .colO{font-size:14px; font-weight:700; fill:#a8761d; letter-spacing:.08em}
    .bt {font-size:15px; font-weight:600; fill:#23302b}
    .bt2{font-size:17px; font-weight:700; fill:#23302b}
    .bd {font-size:11.5px; fill:#67756e}
    .lb {font-size:11px; fill:#8a968f}
    .pl {font-size:15px; font-weight:600; fill:#23302b}
    .mono{font-family:"SF Mono",Menlo,monospace; font-size:11.5px; fill:#1d6b52}
    .chip{font-size:10.5px; font-weight:700}
  </style>
</defs>

<rect width="1240" height="940" fill="#fbfcfb"/>

<text class="h" x="46" y="52">Demo 未来接入的两类外部能力</text>
<text class="sub" x="46" y="78">上半：办公平台提供「触达员工的通道」　·　下半：大模型提供「对话的措辞」　·　两者汇聚在员工看到的同两个界面</text>

<!-- ==================== 上半：办公平台 ==================== -->
<text class="colG" x="46" y="122">① 办公平台　—　提供触达员工的通道</text>

<rect x="46" y="138" width="1148" height="96" rx="12" fill="#f3f8f5" stroke="#cfe2d8"/>
<rect x="76" y="164" width="230" height="44" rx="8" fill="#fff" stroke="#cfe2d8"/>
<text class="pl" x="120" y="192">钉钉</text>
<text class="lb" x="188" y="192">本 Demo 演示</text>
<rect x="336" y="164" width="230" height="44" rx="8" fill="#fff" stroke="#dbe4df"/>
<text class="pl" x="380" y="192">企业微信</text>
<rect x="596" y="164" width="230" height="44" rx="8" fill="#fff" stroke="#dbe4df"/>
<text class="pl" x="640" y="192">飞书</text>
<text class="bd" x="866" y="180">三家能力等价，任选其一部署。</text>
<text class="bd" x="866" y="202">仅用标准开放接口，不依赖专有功能。</text>

<!-- 三条通道 -->
<rect x="46" y="262" width="366" height="92" rx="10" fill="#fff" stroke="#dbe4df"/>
<rect x="46" y="262" width="4" height="92" rx="2" fill="#2d8f6a"/>
<text class="bt" x="70" y="290">自建应用（H5 网页）</text>
<text class="bd" x="70" y="314">工作台图标进入 · OAuth 授权</text>
<text class="bd" x="70" y="336">承载倾诉树洞、匿名广场、我的资源</text>

<rect x="437" y="262" width="366" height="92" rx="10" fill="#fff" stroke="#dbe4df"/>
<rect x="437" y="262" width="4" height="92" rx="2" fill="#2d8f6a"/>
<text class="bt" x="461" y="290">企业内部机器人</text>
<text class="bd" x="461" y="314">消息列表内 · 可收可发</text>
<text class="bd" x="461" y="336">承载机器人会话、转发接收、主动关怀</text>

<rect x="828" y="262" width="366" height="92" rx="10" fill="#fff" stroke="#dbe4df"/>
<rect x="828" y="262" width="4" height="92" rx="2" fill="#2d8f6a"/>
<text class="bt" x="852" y="290">开放接口（标准 API）</text>
<text class="bd" x="852" y="314">考勤 · 审批 · 日程 · 待办</text>
<text class="bd" x="852" y="336">提供工作节奏数据，不含任何聊天内容</text>

<path d="M229 360 L229 392" stroke="#1d6b52" stroke-width="1.8" fill="none" marker-end="url(#g)"/>
<path d="M620 360 L620 392" stroke="#1d6b52" stroke-width="1.8" fill="none" marker-end="url(#g)"/>
<path d="M1011 360 L1011 392" stroke="#1d6b52" stroke-width="1.8" fill="none" marker-end="url(#g)"/>

<!-- ==================== 中：MindBridge 服务端 ==================== -->
<rect x="46" y="396" width="1148" height="86" rx="12" fill="#e9f4ee" stroke="#a9d2bd" stroke-width="1.8"/>
<text class="bt2" x="76" y="432">MindBridge 服务端</text>
<text class="bd" x="76" y="458">判定与合规的归属地　·　匿名化 → 脱敏 → 情绪判定 → 预警分级 → 疗愈方案匹配</text>
<rect x="960" y="418" width="204" height="46" rx="8" fill="#fff" stroke="#a9d2bd"/>
<text class="mono" x="980" y="440">HMAC → 4A6B</text>
<text class="lb" x="980" y="457">身份在入口即被丢弃</text>

<path d="M330 486 L330 518" stroke="#1d6b52" stroke-width="1.8" fill="none" marker-end="url(#g)"/>
<path d="M910 486 L910 518" stroke="#1d6b52" stroke-width="1.8" fill="none" marker-end="url(#g)"/>

<!-- ==================== 中：两个员工触点 ==================== -->
<rect x="46" y="522" width="568" height="112" rx="12" fill="#fff" stroke="#c8873a" stroke-width="2"/>
<text class="bt2" x="76" y="558">倾诉树洞</text>
<rect x="196" y="540" width="86" height="24" rx="12" fill="#fbf0da"/>
<text class="chip" x="209" y="557" fill="#a8761d">H5 页面</text>
<text class="bd" x="76" y="586">深度倾诉 · 匿名广场 · 我的资源</text>
<text class="bd" x="76" y="608">不经过 IM 消息通道</text>

<rect x="626" y="522" width="568" height="112" rx="12" fill="#fff" stroke="#c8873a" stroke-width="2"/>
<text class="bt2" x="656" y="558">机器人会话</text>
<rect x="796" y="540" width="86" height="24" rx="12" fill="#fbf0da"/>
<text class="chip" x="812" y="557" fill="#a8761d">IM 内</text>
<text class="bd" x="656" y="586">日常对话 · 转发接收 · 主动关怀触达</text>
<text class="bd" x="656" y="608">两个入口共享同一匿名身份与画像</text>

<text class="lb" x="46" y="660">员工实际看到的只有这两个界面。上方决定「判定什么」，下方决定「怎么说」。</text>

<path d="M560 690 L560 640" stroke="#c8873a" stroke-width="1.8" fill="none" marker-end="url(#o)"/>
<path d="M1140 690 L1140 640" stroke="#c8873a" stroke-width="1.8" fill="none" marker-end="url(#o)"/>

<!-- ==================== 下半：对话能力管线 ==================== -->
<text class="colO" x="46" y="722">② 大模型　—　提供对话的措辞（当前由内置规则引擎代替，可随时切换）</text>

<rect x="46" y="738" width="1148" height="104" rx="12" fill="#fffaf0" stroke="#ecd9ae"/>

<rect x="76" y="762" width="300" height="58" rx="8" fill="#f3f8f5" stroke="#a9d2bd" stroke-width="1.6"/>
<text class="bt" x="96" y="786">前置安全层</text>
<text class="bd" x="96" y="806">命中危机词 → 不调用模型，走固定话术</text>

<path d="M382 791 L406 791" stroke="#c8873a" stroke-width="1.6" fill="none" marker-end="url(#o)"/>

<rect x="412" y="762" width="300" height="58" rx="8" fill="#fff" stroke="#e2d6bc"/>
<text class="bt" x="432" y="786">大模型生成回应</text>
<text class="bd" x="432" y="806">只负责措辞，不产出情绪标签与预警等级</text>

<path d="M718 791 L742 791" stroke="#c8873a" stroke-width="1.6" fill="none" marker-end="url(#o)"/>

<rect x="748" y="762" width="300" height="58" rx="8" fill="#f3f8f5" stroke="#a9d2bd" stroke-width="1.6"/>
<text class="bt" x="768" y="786">后置校验</text>
<text class="bd" x="768" y="806">拦截诊断性措辞与越界承诺，不合格则回落</text>

<text class="lb" x="1068" y="784">绿色两层</text>
<text class="lb" x="1068" y="802">＝ 现有规则引擎</text>
<text class="lb" x="1068" y="820">直接复用</text>

<!-- 模型提供方 -->
<text class="colO" x="46" y="884">可选的能力提供方</text>
<rect x="196" y="866" width="216" height="28" rx="14" fill="#fff" stroke="#e2d6bc"/>
<text class="bd" x="216" y="885">DeepSeek 官方 API</text>
<rect x="428" y="866" width="290" height="28" rx="14" fill="#fff" stroke="#e2d6bc"/>
<text class="bd" x="448" y="885">政务云 / 行业私有化部署模型</text>
<rect x="734" y="866" width="240" height="28" rx="14" fill="#fff" stroke="#e2d6bc"/>
<text class="bd" x="754" y="885">Claude · 通义等商用 API</text>

<text class="bd" x="46" y="924">判定逻辑与合规约束不依赖具体模型，可随时替换；涉密或数据不出域场景可整套私有化部署。</text>

</svg>
