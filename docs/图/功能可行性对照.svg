<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 862" width="1240" height="862" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<defs>
  <style>
    .h  {font-size:26px; font-weight:700; fill:#23302b}
    .sub{font-size:13.5px; fill:#6e7d76}
    .ch {font-size:12px; font-weight:700; fill:#1d6b52; letter-spacing:.1em}
    .f  {font-size:15px; font-weight:600; fill:#23302b}
    .c  {font-size:13px; fill:#4d5c55}
    .c2 {font-size:11.5px; fill:#8a968f}
    .tag{font-size:11.5px; font-weight:700}
    .arw{font-size:17px; fill:#b7c3bd}
    .foot{font-size:14px; fill:#23302b}
  </style>
</defs>

<rect width="1240" height="862" fill="#fbfcfb"/>

<text class="h" x="52" y="56">Demo 里的每一项功能，都有真实平台能力支撑</text>
<text class="sub" x="52" y="82">演示用的是模拟数据与内置规则引擎；下表逐项列出它在真实环境中依托什么实现</text>

<!-- 表头 -->
<line x1="52" y1="108" x2="1188" y2="108" stroke="#cfe2d8" stroke-width="1.5"/>
<text class="ch" x="52"  y="132">D E M O 　 中 　 你 　 看 　 到 　 的</text>
<text class="ch" x="620" y="132">真 　 实 　 环 　 境 　 中 　 依 　 托 　 什 　 么</text>
<text class="ch" x="1042" y="132">实 　 现 　 方 　 式</text>
<line x1="52" y1="148" x2="1188" y2="148" stroke="#e3ebe7"/>

<!-- 行模板：y0 = 148 + n*74 -->

<!-- 1 -->
<text class="f" x="52"  y="184">从工作台图标进入 MindBridge</text>
<text class="c2" x="52" y="206">首次进入时的授权与匿名化动画</text>
<text class="arw" x="576" y="188">→</text>
<text class="c" x="620" y="184">自建应用（H5 网页）+ OAuth 授权登录</text>
<text class="c2" x="620" y="206">钉钉 · 企业微信 · 飞书 均为标准能力</text>
<rect x="1042" y="168" width="106" height="26" rx="13" fill="#e9f4ee"/>
<text class="tag" x="1057" y="186" fill="#1d6b52">平台原生</text>
<line x1="52" y1="222" x2="1188" y2="222" stroke="#eef3f1"/>

<!-- 2 -->
<text class="f" x="52"  y="258">消息列表里的机器人会话</text>
<text class="c2" x="52" y="280">收发消息、卡片、转接邀请</text>
<text class="arw" x="576" y="262">→</text>
<text class="c" x="620" y="258">企业内部机器人：消息回调 + 主动发送接口</text>
<text class="c2" x="620" y="280">企业微信须用自建应用会话，其群机器人不能收消息</text>
<rect x="1042" y="242" width="106" height="26" rx="13" fill="#e9f4ee"/>
<text class="tag" x="1057" y="260" fill="#1d6b52">平台原生</text>
<line x1="52" y1="296" x2="1188" y2="296" stroke="#eef3f1"/>

<!-- 3 -->
<text class="f" x="52"  y="332">长按消息 → 转发给 MindBridge</text>
<text class="c2" x="52" y="354">单条或多选，条数不限</text>
<text class="arw" x="576" y="336">→</text>
<text class="c" x="620" y="332">用户主动转发消息至应用／机器人会话</text>
<text class="c2" x="620" y="354">飞书可长按直达，钉钉与企微为「转发 → 选择」两步</text>
<rect x="1042" y="316" width="106" height="26" rx="13" fill="#e9f4ee"/>
<text class="tag" x="1057" y="334" fill="#1d6b52">平台原生</text>
<line x1="52" y1="370" x2="1188" y2="370" stroke="#eef3f1"/>

<!-- 4 -->
<text class="f" x="52"  y="406">开场说出本周工作节奏</text>
<text class="c2" x="52" y="428">在校时长 · 连堂课时 · 加班审批 · 待办积压</text>
<text class="arw" x="576" y="410">→</text>
<text class="c" x="620" y="406">考勤打卡 / 审批 / 日程 / 待办　开放接口</text>
<text class="c2" x="620" y="428">企业安装应用时一次性授权，均为标准接口</text>
<rect x="1042" y="390" width="106" height="26" rx="13" fill="#e9f4ee"/>
<text class="tag" x="1057" y="408" fill="#1d6b52">平台原生</text>
<line x1="52" y1="444" x2="1188" y2="444" stroke="#eef3f1"/>

<!-- 5 -->
<text class="f" x="52"  y="480">离开会话后收到主动关怀</text>
<text class="c2" x="52" y="502">系统通知横幅 + 未读红点</text>
<text class="arw" x="576" y="484">→</text>
<text class="c" x="620" y="480">应用主动推送消息接口</text>
<text class="c2" x="620" y="502">无需员工先说话，服务端按触发条件直接下发</text>
<rect x="1042" y="464" width="106" height="26" rx="13" fill="#e9f4ee"/>
<text class="tag" x="1057" y="482" fill="#1d6b52">平台原生</text>
<line x1="52" y1="518" x2="1188" y2="518" stroke="#eef3f1"/>

<!-- 6 -->
<text class="f" x="52"  y="554">真实身份换成匿名编号 4A6B</text>
<text class="c2" x="52" y="576">两个入口自动落到同一匿名身份</text>
<text class="arw" x="576" y="558">→</text>
<text class="c" x="620" y="554">服务端单向哈希，盐由第三方托管</text>
<text class="c2" x="620" y="576">标准密码学实现，不依赖任何平台能力</text>
<rect x="1042" y="538" width="106" height="26" rx="13" fill="#eaf1f6"/>
<text class="tag" x="1050" y="556" fill="#2c5f7d">服务端自建</text>
<line x1="52" y1="592" x2="1188" y2="592" stroke="#eef3f1"/>

<!-- 7 -->
<text class="f" x="52"  y="628">转发内容自动脱敏</text>
<text class="c2" x="52" y="650">人名 → 角色代号，群名 → 泛称，原文不留存</text>
<text class="arw" x="576" y="632">→</text>
<text class="c" x="620" y="628">服务端处理，落地即脱敏</text>
<text class="c2" x="620" y="650">生产环境替换为服务端 NER，Demo 用规则表</text>
<rect x="1042" y="612" width="106" height="26" rx="13" fill="#eaf1f6"/>
<text class="tag" x="1050" y="630" fill="#2c5f7d">服务端自建</text>
<line x1="52" y1="666" x2="1188" y2="666" stroke="#eef3f1"/>

<!-- 8 -->
<text class="f" x="52"  y="702">疗愈师工作台 · HRBP 看板</text>
<text class="c2" x="52" y="724">个案流转 · 团队聚合 · 干预配置</text>
<text class="arw" x="576" y="706">→</text>
<text class="c" x="620" y="702">自有服务端与前端，不依赖办公平台</text>
<text class="c2" x="620" y="724">可 SaaS 部署，也可整套私有化</text>
<rect x="1042" y="686" width="106" height="26" rx="13" fill="#eaf1f6"/>
<text class="tag" x="1050" y="704" fill="#2c5f7d">服务端自建</text>
<line x1="52" y1="740" x2="1188" y2="740" stroke="#eef3f1"/>

<!-- 9 -->
<text class="f" x="52"  y="776">情绪判定与共情回应</text>
<text class="c2" x="52" y="798">Demo 中由内置规则引擎驱动</text>
<text class="arw" x="576" y="780">→</text>
<text class="c" x="620" y="776">可接入大模型 API 生成回应</text>
<text class="c2" x="620" y="798">判定与预警仍由规则层输出，模型只负责措辞</text>
<rect x="1042" y="760" width="106" height="26" rx="13" fill="#fbf0da"/>
<text class="tag" x="1050" y="778" fill="#a8761d">可升级接入</text>
<line x1="52" y1="814" x2="1188" y2="814" stroke="#cfe2d8" stroke-width="1.5"/>

<!-- 底部结论 -->
<text class="foot" x="52" y="846">以上九项均无技术阻塞。<tspan font-weight="700" fill="#1d6b52">唯一不接入的是「会话内容存档」——不是做不到，是主动不做。</tspan></text>

</svg>
