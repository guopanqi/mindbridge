<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>MindBridge</title>
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/vendor/dingtalk-auth-v3.js"></script>
    <script defer src="/app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <p class="eyebrow">MINDBRIDGE · 企业心理支持</p>
      <h1>给自己留一座桥</h1>
      <p class="lead">从钉钉工作台进入后，我们只建立匿名会话。你的钉钉身份不会展示给 HR 或疗愈师。</p>

      <section class="status-card" aria-live="polite">
        <span id="status-dot" class="status-dot pending"></span>
        <div>
          <p id="status-title" class="status-title">等待建立匿名会话</p>
          <p id="status-detail" class="status-detail">请从钉钉工作台打开本应用。</p>
        </div>
      </section>

      <button id="auth-button" class="primary" type="button">通过钉钉建立匿名会话</button>
      <button id="logout-button" class="secondary" type="button" hidden>结束本次匿名会话</button>

      <section class="privacy-card">
        <h2>这一步会发生什么</h2>
        <ol>
          <li>钉钉确认你属于当前企业；</li>
          <li>服务端创建稳定匿名身份与短期会话；</li>
          <li>业务系统不保存明文钉钉用户标识。</li>
        </ol>
      </section>
    </main>
  </body>
</html>
