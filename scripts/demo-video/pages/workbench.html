<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>工作台</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", sans-serif; background: #f5f6f8; color: #1f2329; height: 100vh; overflow: hidden; }
  header { background: #fff; padding: 73px 16px 10px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .org { font-size: 12px; color: #8f959e; margin-top: 2px; }
  .search { margin: 10px 16px 0; background: #fff; border-radius: 10px; padding: 9px 12px; color: #b0b5bc; font-size: 14px; }
  section { margin: 14px 16px 0; background: #fff; border-radius: 12px; padding: 14px 10px 6px; }
  section h2 { margin: 0 0 8px 6px; font-size: 14px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 14px; }
  .app { display: grid; justify-items: center; gap: 6px; font-size: 12px; color: #3b4048; }
  .ico { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; color: #fff; }
  .mb { background: linear-gradient(140deg, #5fbfa8, #147b6f); font-size: 24px; box-shadow: 0 4px 12px rgba(20,123,111,.3); }
</style>
</head>
<body>
  <header><div><h1>工作台</h1><div class="org">星原科技</div></div><div style="font-size:20px;color:#8f959e">⌕</div></header>
  <div class="search">搜索应用</div>
  <section>
    <h2>常用应用</h2>
    <div class="grid">
      <div class="app"><div class="ico" style="background:#4c8bf5">📅</div>日程</div>
      <div class="app"><div class="ico" style="background:#f5a623">📝</div>审批</div>
      <div class="app"><div class="ico" style="background:#5b7cf6">🕘</div>考勤打卡</div>
      <div class="app"><div class="ico" style="background:#3cb371">📁</div>文档</div>
      <div class="app" id="mindbridge"><div class="ico mb">🌿</div>MindBridge</div>
      <div class="app"><div class="ico" style="background:#e06666">📣</div>公告</div>
      <div class="app"><div class="ico" style="background:#8e7cc3">👥</div>通讯录</div>
      <div class="app"><div class="ico" style="background:#6fa8dc">🧾</div>报销</div>
    </div>
  </section>
  <section>
    <h2>人事行政</h2>
    <div class="grid">
      <div class="app"><div class="ico" style="background:#76a5af">🏖</div>请假</div>
      <div class="app"><div class="ico" style="background:#c27ba0">🎁</div>福利</div>
      <div class="app"><div class="ico" style="background:#93c47d">🍱</div>订餐</div>
      <div class="app"><div class="ico" style="background:#a4c2f4">🚗</div>用车</div>
    </div>
  </section>
  <script>
    document.getElementById('mindbridge').addEventListener('click', () => { setTimeout(() => { location.href = 'http://localhost:8788/'; }, 260); });
  </script>
</body>
</html>
