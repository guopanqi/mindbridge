<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1a17" />
    <title>MindBridge</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/vendor/dingtalk-auth.15533867a653.js"></script>
    <script defer src="/app.js"></script>
  </head>
  <body>
    <!-- 启动场景：只展示隐私边界，不展示姓名、工号或任何身份标识 -->
    <section id="boot" class="boot" aria-live="polite">
      <div class="boot-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <path d="M20 4c-6 0-11 5-11 11 0 4 2 7 5 9v8a6 6 0 0012 0v-8c3-2 5-5 5-9 0-6-5-11-11-11z" stroke="#eeb96c" stroke-width="1.5" opacity=".8"/>
          <ellipse cx="20" cy="19" rx="4.5" ry="6" fill="#0a1512" stroke="#eeb96c" stroke-width="1.3"/>
          <circle cx="20" cy="19" r="1.7" fill="#eeb96c"/>
        </svg>
      </div>
      <h1 id="boot-title" class="boot-title">正在建立匿名连接</h1>
      <p id="boot-detail" class="boot-detail">你的姓名与工号已被脱敏过滤，不会记录到系统中。</p>
      <ol id="boot-steps" class="boot-steps">
        <li data-step="verify"><i></i>钉钉确认你属于本企业</li>
        <li data-step="strip"><i></i>过滤真实姓名与工号</li>
        <li data-step="anon"><i></i>生成专属随机代号进入</li>
      </ol>
      <div id="boot-fail" class="boot-fail" hidden>
        <p id="boot-fail-text"></p>
        <button id="boot-retry" class="primary" type="button">重试</button>
        <p class="boot-code">管理员诊断码：<span id="boot-code">-</span></p>
      </div>
    </section>

    <div id="app" class="app" hidden>
      <header class="topbar">
        <div class="who">
          <span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></span>
          <div>
            <p class="who-name" id="display-name">匿名同事</p>
            <p class="who-sub" id="organization-label">匿名身份 · HR 与疗愈师都看不到你是谁</p>
          </div>
        </div>
        <button id="privacy-btn" class="ghost" type="button">隐私说明</button>
      </header>

      <main id="main">
        <section id="view-chat" class="view" aria-label="倾诉树洞"></section>
        <section id="view-wall" class="view" hidden aria-label="匿名广场"></section>
        <section id="view-activities" class="view" hidden aria-label="我的活动"></section>
        <section id="view-me" class="view" hidden aria-label="我的"></section>
      </main>

      <nav class="tabbar" role="tablist" aria-label="主导航">
        <button class="tab on" role="tab" aria-selected="true" data-view="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 10 5 20 4c-1 10-6 15-15 15z"/><path d="M5 19c3-4 6-7 10-10"/></svg>倾诉树洞</button>
        <button class="tab" role="tab" aria-selected="false" data-view="wall"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg>匿名广场</button>
        <button class="tab" role="tab" aria-selected="false" data-view="activities"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>我的活动</button>
        <button class="tab" role="tab" aria-selected="false" data-view="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>我的</button>
      </nav>
    </div>

    <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-box">
        <h2 id="sheet-title"></h2>
        <div id="sheet-body"></div>
        <button id="sheet-close" class="secondary" type="button">知道了</button>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
