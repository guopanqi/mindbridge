<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2d6a5a" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>MindBridge 管理后台</title>
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/app.js"></script>
  </head>
  <body>
    <section id="gate" class="gate">
      <div class="gate-box">
        <p class="eyebrow">MINDBRIDGE · 管理后台</p>
        <h1 id="gate-title">正在校验管理员身份</h1>
        <p id="gate-detail" class="gate-detail">请稍候。</p>
        <p id="gate-code" class="gate-code" hidden></p>
      </div>
    </section>

    <div id="console" class="console" hidden>
      <header class="topbar">
        <div>
          <p class="brand">MindBridge 管理后台</p>
          <p id="tenant-line" class="tenant-line"></p>
        </div>
        <div class="topbar-right">
          <span id="staff-name" class="staff-name"></span>
          <button id="sign-out" class="ghost" type="button">退出</button>
        </div>
      </header>

      <div id="origin-banner" class="origin-banner" role="status"></div>

      <nav class="tabs" role="tablist">
        <button class="tab on" role="tab" aria-selected="true" data-view="dashboard">员工关怀看板</button>
        <button class="tab" role="tab" aria-selected="false" data-view="audit">审计记录</button>
      </nav>

      <main>
        <section id="view-dashboard" class="view"></section>
        <section id="view-audit" class="view" hidden></section>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
