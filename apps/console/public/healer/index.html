<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2d6a5a" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>MindBridge 疗愈师工作台</title>
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/healer/app.js"></script>
  </head>
  <body>
    <section id="gate" class="gate">
      <div class="gate-box">
        <p class="eyebrow">MINDBRIDGE · 疗愈师工作台</p>
        <h1 id="gate-title">正在进入工作台</h1>
        <p id="gate-detail" class="gate-detail">请稍候。</p>
        <p id="gate-code" class="gate-code" hidden></p>
        <div id="signin" class="healer-form" hidden>
          <input id="signin-name" type="text" autocomplete="off" value="李佳" placeholder="姓名" aria-label="姓名" />
          <input id="signin-pass" type="password" autocomplete="off" placeholder="密码（演示环境可留空）" aria-label="密码" />
          <button id="signin-go" class="primary" type="button">进入工作台</button>
        </div>
        <details id="healer-gate" class="healer-gate">
          <summary>用邀请码进入</summary>
          <p class="gate-detail">邀请码由企业管理员生成，24 小时内有效。</p>
          <div class="healer-form">
            <input id="healer-code" type="text" autocomplete="off" placeholder="邀请码" aria-label="疗愈师邀请码" />
            <button id="healer-login" class="primary" type="button">进入</button>
          </div>
        </details>
      </div>
    </section>

    <div id="workspace" class="console" hidden>
      <header class="topbar">
        <div>
          <p class="brand">MindBridge 疗愈师工作台</p>
          <p class="tenant-line">个案只显示编号与风险级别；查看对话内容需本人单独授权。</p>
        </div>
        <div class="topbar-right">
          <span id="staff-name" class="staff-name"></span>
          <button id="sign-out" class="ghost" type="button">退出</button>
        </div>
      </header>

      <main>
        <section id="view-cases" class="view"></section>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
